version: 2
updates:
  # Keep third-party GitHub Actions (pinned to commit SHAs in the workflows)
  # bumped deliberately via PRs instead of silently tracking a moving tag.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"

  # Python tooling used by the CI workflows (.github/requirements.txt).
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"

  # npm tooling for the OpenAPI e2e tests (tests/openapi).
  - package-ecosystem: "npm"
    directory: "/tests/openapi"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "ci"

  # Go modules of the Blockbook binary.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    commit-message:
      prefix: "chore"
